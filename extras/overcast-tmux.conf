# overcast — tmux color theme
set -g status-style                 "fg=#bbbbbb,bg=#1a1c1c"
set -g status-left-style            "fg=#eeeeee,bg=#1a1c1c"
set -g status-right-style           "fg=#8a8a8a,bg=#1a1c1c"
set -g window-status-style          "fg=#4a4e4e,bg=#1a1c1c"
set -g window-status-current-style  "fg=#eeeeee,bg=#222424,bold"
set -g window-status-activity-style "fg=#a89a6a,bg=#1a1c1c"
set -g pane-border-style            "fg=#2e3131"
set -g pane-active-border-style     "fg=#5b8aad"
set -g message-style                "fg=#eeeeee,bg=#2a2d2d"
set -g mode-style                   "fg=#222424,bg=#a89a6a"
set -g status-left  "#[fg=#5b8aad,bold] #S #[fg=#2e3131]│ "
set -g status-right "#[fg=#8a8a8a]%H:%M #[fg=#2e3131]│ #[fg=#4d9a94]#H "
set -g window-status-format         " #I:#W "
set -g window-status-current-format " #I:#W "
