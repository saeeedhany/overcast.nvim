# overcast-dawn — tmux color theme (light variant)
# https://github.com/saeeedhany/overcast.nvim

set -g status-style                 "fg=#2e3535,bg=#eaecec"
set -g status-left-style            "fg=#1e2222,bg=#eaecec"
set -g status-right-style           "fg=#4a5555,bg=#eaecec"
set -g window-status-style          "fg=#9aa8a8,bg=#eaecec"
set -g window-status-current-style  "fg=#1e2222,bg=#e2e5e5,bold"
set -g window-status-activity-style "fg=#7a6e40,bg=#eaecec"
set -g pane-border-style            "fg=#c8cece"
set -g pane-active-border-style     "fg=#3a6888"
set -g message-style                "fg=#1e2222,bg=#d8dcdc"
set -g mode-style                   "fg=#e2e5e5,bg=#3a6888"
set -g status-left  "#[fg=#3a6888,bold] #S #[fg=#c8cece]│ "
set -g status-right "#[fg=#4a5555]%H:%M #[fg=#c8cece]│ #[fg=#2e7470]#H "
set -g window-status-format         " #I:#W "
set -g window-status-current-format " #I:#W "
