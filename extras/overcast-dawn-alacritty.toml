# overcast-dawn — alacritty color theme (light variant)
# https://github.com/saeeedhany/overcast.nvim

[colors.primary]
background = "#e2e5e5"
foreground = "#1e2222"

[colors.cursor]
text   = "#e2e5e5"
cursor = "#1e2222"

[colors.selection]
text       = "CellForeground"
background = "#b0baba"

[colors.normal]
black   = "#e2e5e5"
red     = "#a83838"
green   = "#3a7850"
yellow  = "#7a6e40"
blue    = "#3a6888"
magenta = "#6e5080"
cyan    = "#2e7470"
white   = "#2e3535"

[colors.bright]
black   = "#9aa8a8"
red     = "#c04848"
green   = "#4a8860"
yellow  = "#8a7e50"
blue    = "#4a7898"
magenta = "#7e6090"
cyan    = "#3e8480"
white   = "#1e2222"
